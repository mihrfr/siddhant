<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIDDHANT 🔥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      font-family: 'Impact', 'Comic Sans MS', cursive;
      cursor: none;
    }
    #chaos-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      font-size: 28px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <canvas id="chaos-canvas"></canvas>
  <div id="cursor">🗿</div>
  <div id="app"></div>
  <script>
    window.IMGS = [
      '/src/1.jpeg','/src/2.jpeg','/src/3.jpeg','/src/4.jpeg','/src/5.jpeg',
      '/src/6.jpeg','/src/7.jpeg','/src/8.jpeg','/src/9.jpeg','/src/10.jpeg'
    ];
  </script>
  <script src="/src/main.js"></script>
</body>
</html>
